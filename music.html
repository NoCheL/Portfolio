<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオ</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/music.css">
</head>

<body>
    <header>
        <div class="nav-container" id="mainNav">
            <div class="nav-inner">
                <div class="logo-wrapper">
                    <h1 class="logo">PORTFOLIO</h1>
                </div>
                
                <nav>
                    <ul class="nav-links">
                        <li><a href="index.html" class="active-link">Home</a></li>
                        <li><a href="game.html">Game</a></li>
                        <li><a href="site.html">Site</a></li>
                        <li><a href="music.html">Music</a></li>
                        <li><a href="other.html">Other</a></li>
                    </ul>
                </nav>
                <div class="menu-icon" id="menuBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>        
        <section class="hero">
            <div class="plum-blossoms-container"></div>
            <div class="hero-inner">
                <div class="visual-container">
                    <div class="hero-slides">
                        <div class="slide active"><img src="image/main1.png" alt=""></div>
                        <div class="slide"><img src="image/main2.png" alt=""></div>
                        <div class="slide"><img src="image/game3.png" alt=""></div>
                    </div>
                    <div class="visual-overlay"></div>
                </div>

                <div class="hero-text">
                    <span class="view-more">Selected Works</span>
                    <h1 class="main-copy">MUSIC</h1>
                </div>    
            </div>
        </section>
    </header>    

    <main>
        <section class="music-section">
            <div class="music-grid">
                <div class="music-item" style="--theme-color: #00c6c6; --theme-rgb: 0, 198, 198;">
                    <div class="info-badge">
                        <span class="info-icon">i</span>
                        <div class="info-tooltip">
                            <h3>作品解説</h3>
                            <p>うにゅ～</p>
                        </div>
                    </div>

                    <div class="bg-typography">TRACK 01</div>
                    <div class="music-icon-wrapper">
                        <div class="pulse-ring"></div>
                        <div class="music-icon" style="background-image: url('image/main1.png');">
                            <div class="cd-reflect"></div>
                            <div class="cd-inner"></div>
                        </div>
                    </div>
                    <div class="music-info">
                        <div class="text-group">
                            <h2 class="music-title">TETORA</h2>
                            <p class="artist-name"></p>
                        </div>
                        <div class="custom-player">
                            <audio class="audio-element"><source src="audio/track1.mp3" type="audio/mpeg"></audio>
                            <button class="play-btn">▶</button>
                            <div class="controls-group">
                                <div class="time-display"><span class="current-time">0:00</span><span class="duration-time">0:00</span></div>
                                <input type="range" class="seek-bar" value="0" min="0" step="0.1">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="music-item" style="--theme-color: #ff3e81; --theme-rgb: 255, 62, 129;">
                    <div class="info-badge">
                        <span class="info-icon">i</span>
                        <div class="info-tooltip">
                            <h3>作品解説</h3>
                            <p>たすけて～</p>
                        </div>
                    </div>

                    <div class="bg-typography">TRACK 02</div>
                    <div class="music-icon-wrapper">
                        <div class="pulse-ring"></div>
                        <div class="music-icon" style="background-image: url('image/main2.png');">
                            <div class="cd-reflect"></div>
                            <div class="cd-inner"></div>
                        </div>
                    </div>
                    <div class="music-info">
                        <div class="text-group">
                            <h2 class="music-title">Sakura Vibe</h2>
                            <p class="artist-name"></p>
                        </div>
                        <div class="custom-player">
                            <audio class="audio-element"><source src="audio/track2.mp3" type="audio/mpeg"></audio>
                            <button class="play-btn">▶</button>
                            <div class="controls-group">
                                <div class="time-display"><span class="current-time">0:00</span><span class="duration-time">0:00</span></div>
                                <input type="range" class="seek-bar" value="0" min="0" step="0.1">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>        
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-terminal">
                <div class="footer-meta">
                    <span class="footer-brand-mini">TANAKA MIZUKI</span>
                    <span class="footer-sep">/</span>
                    <span class="copyright">&copy;2026 TANAKA MIZUKI. All Rights Reserved.</span>
                </div>
                
                <div class="footer-decoration">
                    <div class="bar-unit"></div>
                    <div class="bar-unit active"></div>
                    <div class="bar-unit"></div>
                </div>
            </div>
        </div>
    </footer>
    <script src="js/js.js"></script>
    <script src="js/music.js"></script>
</body>

</html>
