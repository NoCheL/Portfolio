<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME | ヌルトモ</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="gameex.css">
</head>
<body class="one-screen-optimized">

    <nav class="top-nav">
        <a href="../game.html" class="exit-btn">
            <span class="exit-line"></span>
            <span class="exit-text">Back Page</span>
        </a>
    </nav>

    <main class="main-dashboard">
        <div class="col-visual">
            <div class="viewer-main" id="viewerMain">
                <video id="mainVideo" class="content-item active" autoplay muted loop playsinline>
                    <source src="../movie/nurutomo_pv.mp4" type="video/mp4">
                </video>
                <img id="mainImage" class="content-item" src="" alt="">
            </div>

            <div class="gallery-row">
                <div class="thumb-item active" data-type="video" data-src="../movie/nurutomo_pv.mp4">
                    <div class="thumb-label">VIDEO</div>
                    <video src="../movie/nurutomo_pv.mp4" muted></video>
                </div>
                <div class="thumb-item" data-type="image" data-src="../image/game/nurutomo/game3.png">
                    <img src="../image/game/nurutomo/game3.png" alt="SS1">
                </div>
                <div class="thumb-item" data-type="image" data-src="../image/game/nurutomo/nurutomo1.png">
                    <img src="../image/game/nurutomo/nurutomo1.png" alt="SS2">
                </div>
                <div class="thumb-item" data-type="image" data-src="../image/game/nurutomo/nurutomo2.png">
                    <img src="../image/game/nurutomo/nurutomo2.png" alt="SS3">
                </div>
            </div>
        </div>

        <div class="col-data">
            <header class="p-header">
                <h1 class="p-title">ヌルトモ</h1>
                <div class="p-tags"><span>Unity</span><span>C#</span></div>
            </header>

            <div class="data-scroll-area">
                <section class="data-section">
                    <h2 class="label">制作・担当範囲</h2>
                    <ul class="res-list">
                        <li>
                            <span class="r-tag">プログラミング</span>
                            <p>セーブ機能、キャラクターギミック、UI、設定</p>
                        </li>
                        <li>
                            <span class="r-tag">アニメーション</span>
                            <p>ストーリー、ステージ、UI、設定</p>
                        </li>
                    </ul>
                </section>

                <section class="data-section">
                    <h2 class="label">作品紹介</h2>
                    <p class="desc-text">漁師に掴まってしまったウナギ２匹を操作して、協力して元に住んでいた場所まで逃げ出そう！</p>
                </section>
            </div>

            <footer class="footer-action">
                <div class="spec-row">
                    <div class="spec-cell"><span class="k">製作期間</span><span class="v">3ヶ月</span></div>
                    <div class="spec-cell"><span class="k">プラットフォーム</span><span class="v">PC (Windows)</span></div>
                </div>
                <a href="https://drive.google.com/uc?export=download&id=1xEiIPp_oN0-3FsCLDy77zZ2FM11zKKIM" class="dl-action-btn" target="_blank" rel="noopener noreferrer" download>
                    <span class="btn-text">ダウンロード</span>
                    <span class="btn-icon">↓</span>
                </a>
            </footer>
        </div>
    </main>

    <script src="gameex.js"></script>
</body>
</html>
