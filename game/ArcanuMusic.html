<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME | ArcanuMusic</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="gameex.css">
</head>
<body class="one-screen-optimized">

    <nav class="top-nav">
        <a href="../game.html" class="exit-btn">
            <span class="exit-line"></span>
            <span class="exit-text">Back Page</span>
        </a>
    </nav>

    <main class="main-dashboard">
        <div class="col-visual">
            <div class="viewer-main" id="viewerMain">
                <video id="mainVideo" class="content-item active" autoplay muted loop playsinline>
                    <source src="../ArcanuMusic_Web/movie/playmovie.mp4" type="video/mp4">
                </video>
                <img id="mainImage" class="content-item" src="" alt="">
            </div>

            <div class="gallery-row">
                <div class="thumb-item active" data-type="video" data-src="../ArcanuMusic_Web/movie/playmovie.mp4">
                    <div class="thumb-label">VIDEO</div>
                    <video src="../ArcanuMusic_Web/movie/playmovie.mp4" muted></video>
                </div>
                <div class="thumb-item" data-type="image" data-src="../image/game/ArcanuMusic/game2.png">
                    <img src="../image/game/ArcanuMusic/game2.png" alt="SS1">
                </div>
                <div class="thumb-item" data-type="image" data-src="../image/game/ArcanuMusic/ArcanuMusic1.png">
                    <img src="../image/game/ArcanuMusic/ArcanuMusic1.png" alt="SS2">
                </div>
                <div class="thumb-item" data-type="image" data-src="../image/game/ArcanuMusic/ArcnuMusic3.png">
                    <img src="../image/game/ArcanuMusic/ArcnuMusic3.png" alt="SS3">
                </div>
            </div>
        </div>

        <div class="col-data">
            <header class="p-header">
                <h1 class="p-title">ArcanuMusic</h1>
                <div class="p-tags"><span>Unity</span><span>C#</span></div>
            </header>

            <div class="data-scroll-area">
                <section class="data-section">
                    <h2 class="label">制作・担当範囲</h2>
                    <ul class="res-list">
                        <li>
                            <span class="r-tag">プログラミング</span>
                            <p>UI、マップ選択、ローディング、ボス</p>
                        </li>
                        <li>
                            <span class="r-tag">BGM</span>
                            <p>マップ、ボス曲</p>
                        </li>
                        <li>
                            <span class="r-tag">モデリング</span>
                            <p>ステージ選択の本</p>
                        </li>
                        <li>
                            <span class="r-tag">エフェクト</span>
                            <p>歩くときの音符、スキル（一部）</p>
                        </li>

                    </ul>
                </section>

                <section class="data-section">
                    <h2 class="label">作品紹介</h2>
                    <p class="desc-text">ARCANUMBERで活躍したキャラたちが登場！流れてくる敵をリズムよく切りながらボスを倒そう！</p>
                </section>
            </div>

            <footer class="footer-action">
                <div class="spec-row">
                    <div class="spec-cell"><span class="k">製作期間</span><span class="v">4ヶ月</span></div>
                    <div class="spec-cell"><span class="k">プラットフォーム</span><span class="v">PC (Windows)</span></div>
                </div>
                <a href="assets/game_win.zip" class="dl-action-btn" download>
                    <span class="btn-text">ダウンロード</span>
                    <span class="btn-icon">↓</span>
                </a>
            </footer>
        </div>
    </main>

    <script src="gameex.js"></script>
</body>
</html>
