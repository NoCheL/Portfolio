        <header>		
            <img id="titleimage" src="images/headerimg.jpg">

		</div>
        </header>
        <main>
            <h2>紹介動画</h2>
            <iframe 
                class="mainvideo"
                src="https://www.youtube.com/embed/JmGk6SGK-4g" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
            </div>
            <div class="sizebox">

            <div class="pagetop">
                <a id="pagetext">TOPへ</a>
                <a class="pagetop__link" onclick="stopSlideshow()">
                <span class="pagetop__text"></span>
                </a>
            </div>	
            <div class="mypictop">
                <img id="mypic" src="images/GreenStart1.png" >
                <script>
                    var pics_src = new Array("images/GreenStart1.png","images/GreenStart2.png","images/GreenStart3.png","images/GreenStart4.png");
                    var magicpics_src = new Array("images/GreenMagic1.png","images/GreenMagic2.png","images/GreenMagic3.png");
                    var num = -1;
                    var magicnum=-1;
                    var timer;
                    var magictimer;
                    var isSlideshowActive = true; // フラグ変数

                    function slideshow_timer() {
                        if (isSlideshowActive) {
                        clearTimeout(magictimer);
                        num = (num + 1) % pics_src.length;
                        document.getElementById("mypic").src = pics_src[num];
                        if(num  != 3){
                            timer = setTimeout(slideshow_timer, 500);
                        }
                        else{
                            timer=setTimeout(slideshow_timer, 1000);
                        }
                        }
                    }

                    function stopSlideshow() {
                        isSlideshowActive = false; // フラグをfalseにして停止
                        clearTimeout(timer);
                        if(magicnum<2&&!isSlideshowActive){
                        magicnum = (magicnum + 1);
                        document.getElementById("mypic").src = magicpics_src[magicnum];
                        magictimer=setTimeout(stopSlideshow, 200);
                        }
                        else{
                            window.scroll({ top: 0, behavior: "smooth" });
                            magicnum=-1;
                            num=-1;
                            isSlideshowActive = true; // フラグをfalseにして停止
                            slideshow_timer();
                        }
                    }

                    slideshow_timer();
                </script> 
            </div>	
            </div>
            
        </main>
    </body>
